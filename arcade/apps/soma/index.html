<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Some dois números inteiros com validação e resultado acessível.">
  <title>Calculadora de soma · Arcade Java → JS</title>
  <link rel="stylesheet" href="../../app.css"><script type="module" src="soma.js"></script>
</head>
<body>
  <header class="app-header"><div class="app-header-inner"><a class="back-link" href="/arcade/">← Voltar ao catálogo</a><h1>Calculadora de soma</h1><p class="lead">Some dois números inteiros. O resultado fica dentro da faixa numérica segura do navegador.</p></div></header>
  <main class="app-main"><section class="app-card">
    <form id="form-soma" novalidate>
      <div class="form-grid">
        <div class="field"><label for="primeiro">Primeiro número</label><input id="primeiro" inputmode="numeric" placeholder="Ex.: 12" required></div>
        <div class="field"><label for="segundo">Segundo número</label><input id="segundo" inputmode="numeric" placeholder="Ex.: 8" required></div>
      </div>
      <div class="actions"><button type="submit">Somar</button><button id="limpar" class="secondary" type="button">Limpar</button></div>
    </form>
    <p id="mensagem" class="message" role="status" aria-live="polite"></p>
    <output id="resultado" class="result" aria-live="polite" hidden></output>
  </section></main>
</body>
</html>
