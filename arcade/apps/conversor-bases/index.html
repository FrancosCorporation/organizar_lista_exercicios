<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Bases</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../salas.css">
</head>
<body>
  <div class="sala">
    <a class="voltar" href="../../index.html">← voltar ao arcade</a>
    <h1>🔢 Conversor de Bases</h1>
    <p class="descricao">Port do exercício <code>Conversor de Bases/Logica_1.java</code>.</p>
    <label class="campo">base de entrada
      <select id="base">
        <option value="10">Decimal (10)</option>
        <option value="2">Binário (2)</option>
        <option value="8">Octal (8)</option>
        <option value="16">Hexadecimal (16)</option>
      </select>
    </label>
    <label class="campo">valor <input id="valor" value="255" autocomplete="off"></label>
    <button id="calcular" type="button">Converter</button>
    <div id="saida" class="resultado" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./pagina.js"></script>
</body>
</html>
