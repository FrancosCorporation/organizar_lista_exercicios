<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de Posição (Quartis)</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../salas.css">
</head>
<body>
  <div class="sala">
    <a class="voltar" href="../../index.html">← voltar ao arcade</a>
    <h1>📊 Cálculo de Posição</h1>
    <p class="descricao">Port do <code>Estatistica_calc_quartis.java</code> — porcentagem da posição na sequência: ((f − 0,5) / n) × 100.</p>
    <label class="campo">n — número total da sequência <input id="n" type="number" value="10"></label>
    <label class="campo">f — posição que deseja calcular <input id="f" type="number" value="3"></label>
    <button id="calcular" type="button">Calcular</button>
    <div id="saida" class="resultado" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./pagina.js"></script>
</body>
</html>
