<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diálogos com Return e Validação de Data</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../salas.css">
</head>
<body>
  <div class="sala">
    <a class="voltar" href="../../index.html">← voltar ao arcade</a>
    <h1>💬 Diálogo com Return + Validação de Data</h1>
    <p class="descricao">Ports do <code>CaixaDialogoComReturn.java</code> e <code>CalculadoraDeData/ClasseDeCalculo.java</code>.</p>

    <div class="linha">
      <label class="campo">Dia <input id="dia" type="number" value="30" min="1" max="31"></label>
      <label class="campo">Mês <input id="mes" type="number" value="2" min="1" max="12"></label>
      <button id="validar-data" type="button">Validar data</button>
    </div>
    <button id="perguntar" type="button">Abrir diálogo (atenção)</button>
    <div id="saida" class="resultado" aria-live="polite" hidden></div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal" tabindex="-1" hidden>
    <div class="modal-caixa">
      <h2 id="titulo-modal">Atenção</h2>
      <p>Confirme para registrar verdadeiro ou cancele para registrar falso.</p>
      <div class="botoes">
        <button id="confirmar" type="button">Confirmar</button>
        <button id="cancelar" class="cancelar" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./pagina.js"></script>
</body>
</html>
